name: Build and validate Pawverse Dash
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JS syntax
        run: node --check src/main.js
      - name: Unit tests (two-player race physics)
        run: node --test tests/*.test.js
      - name: Validate race module syntax
        run: node --check src/race.js
      - name: Production build
        run: npm run build
      - name: Validate bundled app
        run: test -f dist/index.html && test -f dist/race.html
      - uses: actions/upload-artifact@v4
        with:
          name: pawverse-dash-web
          path: dist/
          retention-days: 7

  browser-qa:
    name: Real Chromium gameplay QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install game and browser tester
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Launch game web server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pawverse-vite.log 2>&1 &
          echo $! > /tmp/pawverse-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then
              echo "Pawverse Dash dev server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pawverse-vite.log
          exit 1
      - name: Play through solo and local multiplayer in Chromium
        env:
          PAWVERSE_QA_ORIGIN: http://127.0.0.1:5173
        run: node tests/browserQA.mjs
      - name: Upload gameplay screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawverse-chromium-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
