<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f9b9d5">
  <title>Friends Walk & Dynamic World · Pawverse</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; color: #432139; font-family: system-ui, -apple-system, sans-serif; background: #0b1a2e; }
    #walk-ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    #walk-ui button, #walk-ui a, #walk-ui select { pointer-events: auto; }
    header {
      display: flex; gap: 12px; justify-content: space-between; align-items: center;
      padding: 12px 20px; background: rgba(255, 252, 240, 0.94);
      backdrop-filter: blur(12px); box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      font-weight: 800; font-size: 14px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    a.back-btn { color: #984474; text-decoration: none; font-weight: 900; padding: 6px 12px; background: #ffe7f3; border-radius: 12px; }
    #walk-world-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f17cb922; border: 1.5px solid #f17cb955;
      padding: 5px 14px; border-radius: 20px; color: #b83483; font-weight: 800;
    }
    #walk-distance { font-size: 16px; color: #2e7d32; background: #e8f5e9; padding: 5px 12px; border-radius: 16px; }
    #friend-setup {
      pointer-events: auto; max-width: 520px; margin: clamp(20px, 8vh, 90px) auto 0;
      padding: 28px; border-radius: 28px; text-align: center;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(50, 20, 45, 0.25); border: 2px solid #fff;
    }
    #friend-setup h1 { margin: 0 0 8px; color: #c24a93; font-size: clamp(24px, 4.5vw, 36px); }
    #friend-setup p { line-height: 1.5; color: #623651; margin-bottom: 12px; }
    .friend-select { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0; }
    .friend-select label { display: grid; gap: 8px; font-weight: 700; text-align: left; }
    .friend-select select {
      padding: 12px 14px; border-radius: 14px; border: 2px solid #f1a8cf;
      background: white; font: inherit; color: #743d63; font-weight: 600;
    }
    button {
      cursor: pointer; border: 0; border-radius: 18px; padding: 13px 22px;
      background: #f17cb9; color: white; font: 800 15px system-ui;
      box-shadow: 0 4px 14px rgba(184, 52, 131, 0.35); transition: transform .15s, background .15s;
    }
    button:hover { background: #e35da7; transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    #walk-controls {
      margin-bottom: 24px; display: flex; gap: 10px; justify-content: center;
      width: 100%; padding: 0 16px;
    }
    #walk-controls[hidden] { display: none; }
    #walk-controls button {
      background: rgba(255, 255, 255, 0.92); color: #782c5f;
      backdrop-filter: blur(8px); border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    #walk-controls button.active-mode {
      background: #f17cb9; color: white; border-color: #f17cb9;
    }
    .biome-toast {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      padding: 8px 22px; border-radius: 30px; background: rgba(0,0,0,0.72);
      color: #fff; font-weight: 800; font-size: 15px; letter-spacing: 0.5px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.3); pointer-events: none;
      opacity: 0; transition: opacity .4s ease; z-index: 5;
    }
    @media(max-width: 580px) {
      #friend-setup { margin: 20px 14px; padding: 20px; }
      .friend-select { grid-template-columns: 1fr; }
      #walk-controls { flex-wrap: wrap; }
      header { font-size: 12px; padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <div id="walk-ui">
    <header>
      <div class="header-left">
        <a href="./index.html" class="back-btn" aria-label="Back to Pawverse Dash">← BACK</a>
        <strong>🐾 DYNAMIC WORLD</strong>
        <span id="walk-world-badge">🌸 Blossom Meadow</span>
      </div>
      <span id="walk-distance">0 m</span>
    </header>

    <div id="biomeToast" class="biome-toast">Entering New Biome</div>

    <section id="friend-setup">
      <h1>Let's Explore Together! 💕</h1>
      <p>Continuous dynamic world with standing horizon mountains and streaming landscapes. Choose two baby-animal friends.</p>
      <div class="friend-select">
        <label>Friend One<select id="friend-one"></select></label>
        <label>Friend Two<select id="friend-two"></select></label>
      </div>
      <button id="walk-start">🌸 START ADVENTURE</button>
      <p style="margin-top:14px;font-size:13px;opacity:0.85">Multi-tier Parallax · Standing Horizon · Dynamic Biomes</p>
    </section>

    <div id="walk-controls" hidden>
      <button id="walk-speed-toggle">🚶 Mode: Walk</button>
      <button id="walk-camera">📷 Cam: Follow</button>
      <button id="walk-pause">⏸ Pause</button>
      <button id="walk-change">🐾 Change Friends</button>
    </div>
  </div>

  <script type="module" src="/src/friendsWalk.js"></script>
</body>
</html>
